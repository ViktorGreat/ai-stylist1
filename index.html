<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>AI Стилист</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .upload-area { border: 3px dashed #6366f1; border-radius: 15px; padding: 40px 20px; text-align: center; cursor: pointer; background: #f8f9ff; transition: 0.3s; }
        .upload-area:hover { background: #eef0ff; }
        .upload-area.has-image { border-style: solid; padding: 20px; }
        .upload-area img { max-width: 100%; max-height: 300px; border-radius: 10px; }
        .gender-selector { display: flex; gap: 15px; margin: 20px 0; }
        .gender-btn { flex: 1; padding: 15px; border: 2px solid #e5e7eb; border-radius: 10px; background: white; cursor: pointer; font-size: 1em; font-weight: 600; }
        .gender-btn.active { border-color: #6366f1; background: #6366f1; color: white; }
        .analyze-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 1.1em; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-content { line-height: 1.6; }
        .result-content h2 { color: #6366f1; margin: 20px 0 10px; font-size: 1.3em; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .result-content ul { margin: 10px 0 10px 20px; }
        .market-btn { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: white; font-weight: 600; font-size: 0.9em; display: inline-block; margin-right: 5px; margin-bottom: 5px;}
        .wb-btn { background: #cb11ab; }
        .ozon-btn { background: #005bff; }
        .error { background: #fee; color: #c33; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .product-item { margin: 15px 0; padding: 15px; background: #fff; border-radius: 10px; border: 1px solid #eee; }
        #fileInput { display: none; }
        .cache-badge { display: inline-block; background: #4caf50; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; margin-bottom: 10px; }
        details.shop-details { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 15px; padding: 20px; margin: 25px 0; box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        details.shop-details summary { cursor: pointer; font-weight: bold; color: white; font-size: 1.2em; list-style: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
        details.shop-details summary::-webkit-details-marker { display: none; }
        details.shop-details summary::before { content: '🛍️'; font-size: 1.3em; }
        details.shop-details[open] { animation: none; background: white; border: 2px solid #667eea; }
        details.shop-details[open] summary { color: #667eea; margin-bottom: 15px; }
        .shop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; padding: 10px; background: #f8f9ff; border-radius: 8px; }
        .shop-label { font-weight: bold; min-width: 150px; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ AI Стилист</h1>
            <p>Загрузи фото — получи персональные рекомендации</p>
        </div>
        <div class="card">
            <input type="file" id="fileInput" accept="image/*">
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 3em; margin-bottom: 10px;">📸</div>
                <p>Нажми, чтобы выбрать фото</p>
            </div>
            <div class="gender-selector">
                <button class="gender-btn active" data-gender="женщина">👩 Женский</button>
                <button class="gender-btn" data-gender="мужчина">👨 Мужской</button>
            </div>
            <button class="analyze-btn" id="analyzeBtn" disabled>Получить рекомендации</button>
        </div>
        <div id="resultContainer"></div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const genderBtns = document.querySelectorAll('.gender-btn');
        let selectedFile = null;
        let selectedGender = 'женщина';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadArea.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
                    uploadArea.classList.add('has-image');
                    analyzeBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });
        genderBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                genderBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedGender = btn.dataset.gender;
            });
        });

        function compressImage(file, maxWidth = 1024, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Сжатие не удалось'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Сжимаем фото...';
            resultContainer.innerHTML = '<div class="card loading"><div class="spinner"></div><p>Подготавливаем фото...</p></div>';
            
            try {
                const compressed = await compressImage(selectedFile, 1024, 0.75);
                const formData = new FormData();
                formData.append('file', compressed, 'photo.jpg');
                formData.append('gender', selectedGender);
                
                analyzeBtn.textContent = 'Анализируем стиль...';
                
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                
                // ЗАЩИТА: проверяем, что сервер вернул именно JSON, а не HTML-ошибку
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Сервер вернул некорректный ответ. Попробуйте еще раз.");
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    let html = '<div class="card"><div class="result-content">';
                    if (data.from_cache) {
                        html += '<span class="cache-badge">⚡ Из кэша (мгновенно)</span><br>';
                    }
                    html += data.recommendation + '</div></div>';
                    
                    if (data.products && data.products.length > 0) {
                        html += '<div class="card"><h2>🛍 Найденные товары:</h2>';
                        data.products.forEach(product => {
                            let btnClass = product.marketplace === 'WB' ? 'wb-btn' : 'ozon-btn';
                            let btnText = 'Купить на ' + product.marketplace;
                            html += '<div class="product-item"><b>' + product.name + '</b><br><span style="color:#cb11ab; font-weight:bold; font-size:1.1em;">' + product.price + ' ₽</span><br><a href="' + product.link + '" target="_blank" class="market-btn ' + btnClass + '" style="margin-top:10px;">' + btnText + '</a></div>';
                        });
                        html += '</div>';
                    } else {
                        html += '<div class="card"><p style="text-align:center; color:#666;">Товары не найдены (возможно, временная блокировка поиска), но рекомендации выше актуальны!</p></div>';
                    }
                    resultContainer.innerHTML = html;
                } else {
                    resultContainer.innerHTML = '<div class="card"><div class="error">❌ Ошибка: ' + (data.detail || 'Неизвестная ошибка') + '</div></div>';
                }
            } catch (error) {
                resultContainer.innerHTML = '<div class="card"><div class="error">❌ Ошибка: ' + error.message + '</div></div>';
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Получить рекомендации';
            }
        });
    </script>
</body>
</html>
